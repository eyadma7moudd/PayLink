services:
  app:
    build: .
    container_name: paylink_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: paylink_db
    environment:
      POSTGRES_DB: paylink
      POSTGRES_USER: paylink_user
      POSTGRES_PASSWORD: paylink_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink_user -d paylink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
